# Value Function 训练配置
# 使用方法: python scripts/train_value.py --config config/train_value.yaml

# 数据配置
data_dir: data/raw
train_datasets:
  - 2026.09.15
  - 2026.09.15_2
  - 2026.09.16_error
val_dataset: 2026.09.08
tag: z02_fail2000_v1
cameras:
  - cam2

# 模型配置
siglip_path: models/siglip2-so400m-patch14-224
gemma_path: models/gemma-3-270m
freeze_vlm: true

# 训练超参数
batch_size: 2
num_epochs: 50
lr: 1.0e-4
warmup_steps: 500

# 数据限制（null表示不限制）
max_samples: null

# 步数限制（null表示跑完整epoch）
max_steps: null
val_steps: null

# 保存
save_dir: checkpoints
