# Local data entry: recap_datasets.recap.loader.create_value_dataloader
# Model/optimizer settings are retained for a future local training entry point.

defaults:
  - model/recap_value_model@actor.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "value_sft_z02"
    logger_backends: ["tensorboard"]

  max_epochs: 100
  max_steps: 8000
  val_check_interval: 500
  save_interval: 3000

data:
  adaptation_config: config/z02_data.yaml
  image_processor_path: models/siglip2-so400m-patch14-224
  train_num_workers: 4
  eval_num_workers: 2
  prefetch_factor: 2
  persistent_workers: false
  pin_memory: false
  include_state: false  # 09.08 has an unverified historical 20D protocol.
  include_actions: false  # V(o, language) does not require actions.
  action_horizon: 10
  action_dim: 32
  balance_weights: false  # Natural frame distribution; optional dataset_weights below.
  dataset_weights: {}    # If enabled: values are total probability mass per dataset.

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4  # Reduced for 16GB GPU
  global_batch_size: 32  # Reduced for single GPU
  seed: 0

  model:
    precision: bf16
    siglip_path: "/home/zoyi/my_work/RECAP-value-function-main/models/siglip2-so400m-patch14-224"
    gemma3_path: "/home/zoyi/my_work/RECAP-value-function-main/models/gemma-3-270m"
    tokenizer_path: "/home/zoyi/my_work/RECAP-value-function-main/models/gemma-3-270m"
    freeze_vlm: true  # Freeze VLM for initial training
    action_dim: 32
    action_horizon: 10

  optim:
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: "constant"
    lr_warmup_steps: 500
    total_training_steps: 8000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False