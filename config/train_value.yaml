# Local SigLIP + distributional value baseline (201-bin categorical).
# python scripts/value_function.py value train --smoke_test
adaptation_config: config/z02_data.yaml
cameras: [cam2]
siglip_path: models/siglip2-so400m-patch14-224
freeze_vlm: true
projection_dim: 640
precision: bf16
num_bins: 201  # Number of bins for categorical value distribution
seed: 42
torch_threads: 4

# Online image batches / one-time frozen-encoder extraction. Measured on RTX 4080 SUPER.
batch_size: 16
num_workers: 4
eval_num_workers: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2
video_cache_handles: 4

# No augmentation: frozen deterministic features can be reused across epochs.
feature_cache: true
cache_dir: data/cache/value_features_v1
cache_batch_size: 16
cache_num_workers: 4
cached_batch_size: 1024
cached_num_workers: 0
cache_on_device: true  # ~0.60 GiB train+val; fall back to CPU if GPU memory is tight.

# Bounded training; full validation every epoch, retain the best validation checkpoint.
num_epochs: 24
max_total_steps: 5000  # 242 steps/full epoch: at most ~20.7 passes; early stopping may stop sooner.
early_stopping_patience: 4
early_stopping_min_delta: 1.0e-5
lr: 1.0e-4
warmup_steps: 200
weight_decay: 0.0
clip_grad_norm: 1.0
log_interval: 100
max_samples: null
max_steps: null  # optional batches per training epoch
val_steps: null
save_dir: checkpoints/optimized
